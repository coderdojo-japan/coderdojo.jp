name: Daily Workflow

on:
  schedule:
    # 毎朝 9:00 JST
    - cron: '0 0 * * *'
  # Allows you to run this workflow manually from the Actions tab
  # https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    outputs:
      FOUND_NEWS: ${{ steps.check_news.outputs.FOUND_NEWS }}

    steps:
    - name: ☑️ Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - name: 💎 Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: 📰 Run news:fetch task
      run: bin/rails news:fetch

    - name: 🆙 Commit updated news.yml
      id: check_news
      run: |
        git config user.name  "Yohei Yasukawa"
        git config user.email "yohei@yasslab.jp"
        git checkout main
        git add db/news.yml
        if ! git diff --cached --quiet; then
          git commit -m '🤖 Upsert db/news.yml'
          git push origin main
          echo "🆕 Found news in db/news.yml"
          echo "FOUND_NEWS=true"  >> $GITHUB_OUTPUT
        else
          echo "✅ No news in db/news.yml"
          echo "FOUND_NEWS=false" >> $GITHUB_OUTPUT
        fi

  run-on-heroku:
    needs: daily
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: 📦 Install Heroku CLI
      run: curl https://cli-assets.heroku.com/install.sh | sh

    - name: 📅 Run upcoming_events:aggregation on Heroku
      run: |
        heroku run rails upcoming_events:aggregation --app $HEROKU_APP_NAME
      env:
        HEROKU_API_KEY:  ${{ secrets.HEROKU_API_KEY  }}
        HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}

  deploy:
    needs: daily
    if: ${{ needs.daily.outputs.FOUND_NEWS == 'true' }}
    # TODO: ubuntu-latest image needs to install heroku CLI to deploy.
    # https://github.com/AkhileshNS/heroku-deploy/issues/188
    runs-on: ubuntu-22.04

    steps:
    - name: ☑️ Checkout code
      uses: actions/checkout@v7
      with:
        ref: main

    - name: 🚀 Deploy to Heroku
      # heroku-deploy は v3 に固定する。v4 は push 先を refs/head/main と組み立てており
      # (正しくは refs/heads/main)、Heroku 側が main への push と認識できずに
      # `Pushed to branch other than [main, master], skipping build.` としてビルドを
      # スキップする。push 自体は成功するため Actions は success と表示され、
      # デプロイされていないことに気付けない。branch 入力を指定しても解消しない。
      # 詳細は PR #1847 / #1848 を参照。
      uses: akhileshns/heroku-deploy@v3.15.15
      with:
        heroku_api_key:  ${{ secrets.HEROKU_API_KEY  }}
        heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
        heroku_email:    ${{ secrets.HEROKU_EMAIL    }}
    # Actions の success は配送の成功でしかない。git push は release フェーズの完了まで
    # 待つが、release が失敗しても push は成功扱いになり、ビルドがスキップされた時も
    # 同じく緑になる (PR #1942)。本番に届いたかはリリースの状態で見る。
    #
    # 本番の配信物との照合は使えない。script/release.sh は news:upsert を
    # podcasts:upsert より先に走らせ、release dyno は旧 dyno と同じ DB を使うため、
    # 後半が落ちても配信物だけは期待どおりに見えてしまう。
    - name: ✅ リリースが本番に届いたことを確認する
      env:
        HEROKU_API_KEY:  ${{ secrets.HEROKU_API_KEY  }}
        HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
      run: |
        # GITHUB_SHA は daily.yml が db/news.yml を push する前の main を指すので使えない
        sha=$(git rev-parse --short=7 HEAD)
        releases=$(heroku releases --json --num 5 --app "$HEROKU_APP_NAME")
        echo "$releases" | jq -r '.[] | "v\(.version)\t\(.status)\t\(.description)"'
        echo "$releases" | jq -e --arg sha "$sha" \
          'any(.[]; (.description | contains($sha)) and .status == "succeeded")' > /dev/null \
          || { echo "::error::$sha のリリースが succeeded ではありません。heroku releases:output で確認してください"; exit 1; }
