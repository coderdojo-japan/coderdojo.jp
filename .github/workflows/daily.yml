name: Daily Workflow

on:
  schedule:
    # 毎朝 9:00 JST
    - cron: '0 0 * * *'
  # Allows you to run this workflow manually from the Actions tab
  # https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:

# GITHUB_TOKEN は既定では読み取りだけにし、main へ push する daily ジョブにだけ書き込みを渡す
permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    # 取ったニュースをコミットして main へ push する
    permissions:
      contents: write
    outputs:
      FOUND_NEWS: ${{ steps.check_news.outputs.FOUND_NEWS }}

    steps:
    - name: ☑️ Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - name: 💎 Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: 📰 Run news:fetch task
      run: bin/rails news:fetch

    - name: 🆙 Commit updated news.yml
      id: check_news
      run: |
        git config user.name  "Yohei Yasukawa"
        git config user.email "yohei@yasslab.jp"
        git checkout main
        git add db/news.yml
        if ! git diff --cached --quiet; then
          git commit -m '🤖 Upsert db/news.yml'
          git push origin main
          echo "🆕 Found news in db/news.yml"
          echo "FOUND_NEWS=true"  >> $GITHUB_OUTPUT
        else
          echo "✅ No news in db/news.yml"
          echo "FOUND_NEWS=false" >> $GITHUB_OUTPUT
        fi

  run-on-heroku:
    needs: daily
    # news:fetch が失敗しても（news.coderdojo.jp が落ちている時など）、イベントの集計は続ける
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: 📦 Install Heroku CLI
      run: curl https://cli-assets.heroku.com/install.sh | sh

    - name: 📅 Run upcoming_events:aggregation on Heroku
      run: |
        heroku run rails upcoming_events:aggregation --app $HEROKU_APP_NAME
      env:
        HEROKU_API_KEY:  ${{ secrets.HEROKU_API_KEY  }}
        HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}

  deploy:
    needs: daily
    if: ${{ needs.daily.outputs.FOUND_NEWS == 'true' }}
    # 続けてマージされた時に、Heroku へのデプロイが重ならないよう 1 つずつ、待った順に動かす。同じアプリに配る test.yml の deploy も同じ group
    concurrency:
      group: deploy-main
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04

    steps:
    - name: ☑️ Checkout code
      uses: actions/checkout@v7
      with:
        ref: main

    # 後続の heroku releases は Heroku CLI を呼ぶが、ubuntu-24.04 のイメージには入っていない
    - name: 🟪 Set up Heroku CLI
      uses: ./.github/actions/setup-heroku-cli

    - name: 🚀 Deploy to Heroku
      # Heroku の API キーを第三者の action に渡さないよう、自前の action で git push する。
      # 以前の akhileshns/heroku-deploy の v4 は push 先を refs/head/main と組み立て、Heroku がビルドを
      # 黙ってスキップした (PR #1847 / #1848)。自前の action は refs/heads/main へ push する。
      # 強制 push はしないので、後から終わった古い回の push は早送りにならず Heroku に拒否され、その回が失敗する。
      # 全経路が同じ版かは spec/heroku_deploy_version_spec.rb で守っている。
      uses: yasslab/heroku_deploy_action@c08735737346db5c70a7adcf8d5dcc251e547e34 # v1.0.0
      with:
        heroku_api_key:  ${{ secrets.HEROKU_API_KEY  }}
        heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
        heroku_email:    ${{ secrets.HEROKU_EMAIL    }}
    # Actions の success は配送の成功でしかない。git push は release フェーズの完了まで
    # 待つが、release が失敗しても push は成功扱いになり、ビルドがスキップされた時も
    # 同じく緑になる (PR #1942)。本番に届いたかはリリースの状態で見る。
    #
    # 本番の配信物との照合は使えない。script/release.sh は news:upsert を
    # podcasts:upsert より先に走らせ、release dyno は旧 dyno と同じ DB を使うため、
    # 後半が落ちても配信物だけは期待どおりに見えてしまう。
    - name: ✅ リリースが本番に届いたことを確認する
      env:
        HEROKU_API_KEY:  ${{ secrets.HEROKU_API_KEY  }}
        HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
      run: |
        # GITHUB_SHA は daily.yml が db/news.yml を push する前の main を指すので使えない
        sha=$(git rev-parse --short=7 HEAD)
        releases=$(heroku releases --json --num 5 --app "$HEROKU_APP_NAME")
        echo "$releases" | jq -r '.[] | "v\(.version)\t\(.status)\t\(.description)"'
        echo "$releases" | jq -e --arg sha "$sha" \
          'any(.[]; (.description | contains($sha)) and .status == "succeeded")' > /dev/null \
          || { echo "::error::$sha のリリースが succeeded ではありません。heroku releases:output で確認してください"; exit 1; }
