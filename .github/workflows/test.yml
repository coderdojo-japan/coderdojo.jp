name: actions
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  # Allows you to run this workflow manually from the Actions tab
  # https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_HOST: localhost
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
      DATABASE_PORT: 5432
      TZ: Asia/Tokyo

    services:
      db:
        # 本番（Heroku Postgres）と同じメジャー版にする。本番の DB を上げたら、ここも上げる
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password

    steps:
      - name: ☑️ Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # seed は spec/rails_helper.rb が読み込むので、ここではテスト用 DB を作るだけにする
      - name: 🧪 Prepare DB
        run: bundle exec rails db:create db:schema:load
        env:
          RAILS_ENV: test

      - name: 🔧 Test
        run: bundle exec rspec spec

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    # 続けてマージされた時に、Heroku へのデプロイが重ならないよう 1 つずつ、待った順に動かす。同じアプリに配る daily.yml の deploy も同じ group
    concurrency:
      group: deploy-main
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # heroku-deploy と後続の heroku releases は Heroku CLI を呼ぶが、ubuntu-24.04 のイメージには入っていない
      - uses: ./.github/actions/setup-heroku-cli
      # heroku-deploy は v3 に固定する。v4 は push 先を refs/head/main と組み立てており
      # (正しくは refs/heads/main)、Heroku 側が main への push と認識できずに
      # `Pushed to branch other than [main, master], skipping build.` としてビルドを
      # スキップする。push 自体は成功するため Actions は success と表示され、
      # デプロイされていないことに気付けない。branch 入力を指定しても解消しない。
      # 詳細は PR #1847 / #1848 を参照。
      - uses: akhileshns/heroku-deploy@1b080913896a5d6d44a18e9e208f8eb1fee9b0f7 # v3.15.15
        with:
          heroku_api_key:  ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email:    ${{ secrets.HEROKU_EMAIL }}
          # --force を使わない。このアクションは、Heroku の方が新しくて push が拒否されると --force で送り直すので、
          # 後から終わった古い回が、本番を古いコミットに戻しうる（続けてマージした時など）。
          # --force なしなら、古い回の push は早送りにならず Heroku に拒否され、その回が失敗する
          dontuseforce:    true
      # Actions の success は配送の成功でしかない。git push は release フェーズの完了まで
      # 待つが、release が失敗しても push は成功扱いになり、ビルドがスキップされた時も
      # 同じく緑になる (PR #1942)。本番に届いたかはリリースの状態で見る。
      #
      # 本番の配信物との照合は使えない。script/release.sh は news:upsert を
      # podcasts:upsert より先に走らせ、release dyno は旧 dyno と同じ DB を使うため、
      # 後半が落ちても配信物だけは期待どおりに見えてしまう。
      - name: ✅ リリースが本番に届いたことを確認する
        env:
          HEROKU_API_KEY:  ${{ secrets.HEROKU_API_KEY  }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          # GITHUB_SHA は daily.yml が db/news.yml を push する前の main を指すので使えない
          sha=$(git rev-parse --short=7 HEAD)
          releases=$(heroku releases --json --num 5 --app "$HEROKU_APP_NAME")
          echo "$releases" | jq -r '.[] | "v\(.version)\t\(.status)\t\(.description)"'
          echo "$releases" | jq -e --arg sha "$sha" \
            'any(.[]; (.description | contains($sha)) and .status == "succeeded")' > /dev/null \
            || { echo "::error::$sha のリリースが succeeded ではありません。heroku releases:output で確認してください"; exit 1; }
